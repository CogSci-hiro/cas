epochs:
  output:
    root: "epochs"
  timing:
    tmin_s: -0.2
    tmax_s: 0.8
    baseline_s:
      - -0.2
      - 0.0
  event_types:
    - "self_fpp_onset"
    - "self_fpp_offset"
    - "other_fpp_onset"
    - "other_fpp_offset"
    - "self_spp_onset"
    - "self_spp_offset"
    - "other_spp_onset"
    - "other_spp_offset"
  reject_by_annotation: true

induced_source_epochs:
  output:
    root: "induced_source_epochs"
  timing:
    tmin_s: -1.0
    tmax_s: 0.3
    baseline_s:
      - -1.0
      - 0.3

induced_source_epochs_conf_disc_fpp_locked:
  output:
    root: "induced_source_epochs_conf_disc_fpp_locked"
  timing:
    tmin_s: -1.0
    tmax_s: 0.3
    baseline_s:
      - -1.0
      - 0.3
  event_types:
    - "self_fpp_onset"
    - "other_fpp_onset"
    - "self_spp_onset"
    - "other_spp_onset"
  event_source_column_overrides:
    self_spp_onset: "fpp_onset"
    other_spp_onset: "fpp_onset"
  time_locking_reference: "fpp_onset"

induced_source_epochs_conf_disc_spp_locked:
  output:
    root: "induced_source_epochs_conf_disc_spp_locked"
  timing:
    tmin_s: -1.0
    tmax_s: 0.3
    baseline_s:
      - -1.0
      - 0.3
  event_types:
    - "self_fpp_onset"
    - "other_fpp_onset"
    - "self_spp_onset"
    - "other_spp_onset"
  event_source_column_overrides:
    self_fpp_onset: "spp_onset"
    other_fpp_onset: "spp_onset"
  time_locking_reference: "spp_onset"

induced_epochs:
  bands: ["theta", "alpha", "beta"]
