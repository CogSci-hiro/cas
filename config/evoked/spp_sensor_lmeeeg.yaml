lmeeeg:
  enabled: true
  backend: "lmeeeg"
  analysis_name: "spp_evoked_sensor"
  random_effects:
    group: "subject_id"
    structure: "random_intercept"

  selection:
    # Optional shared selection defaults for all models.
    # event_type: "other_spp_onset"
    # Optional second-stage pandas query over epoch metadata after epochs[event_type].
    # metadata_query: "latency > 0 and duration_s >= 0.1"
    min_duration_s: null

  models:
    evoked_model:
      modality: "evoked"
      selection:
        event_type: "other_spp_onset"
      contrast_of_interest: "spp_class_1"
      formula: "~ spp_class_1 + latency + run + z_fpp_anchor_alpha_power"
      derived_predictors:
        fpp_anchor_alpha_power:
          enabled: true
          kind: "band_power_window"
          anchor_column: "fpp_onset"
          conversation_anchor_column: "conversation_anchor_time_s"
          roi: "anterior"
          window_s: [-0.5, -0.0]
          band_hz: [7.0, 13.0]
          output_column: "z_fpp_anchor_alpha_power"
          standardize: true
      eligibility:
        not_null:
          - "spp_class_1"
          - "latency"
          - "duration_s"
          - "z_fpp_anchor_alpha_power"
        min_values:
          duration_s: 0.10
      test_predictors:
        - "spp_class_1"
        - "z_fpp_anchor_alpha_power"
      standardize:
        - "latency"
      # Full SPP ERP/amplitude model: one class effect plus optional duration controls.
      duration_controls:
        duration_column: "duration_s"
        log_duration:
          enabled: true
          output_column: "z_log_spp_duration"
          offset_s: 0.001
          standardize: true
        duration_bins:
          enabled: false
          output_column: "spp_duration_bin"
          n_bins: 5
          strategy: "quantile"
          labels_prefix: "dur_q"
          min_unique_bins: 3
          on_insufficient_unique_bins: "raise"
        common_support:
          enabled: false
          class_column: "spp_class_1"
          lower_quantile: 0.05
          upper_quantile: 0.95
      term_tests:
        class_effect:
          enabled: true
          contrast_type: "categorical"
          terms:
            - "spp_class_1"
        duration_log:
          enabled: true
          contrast_type: "continuous"
          terms:
            - "z_log_spp_duration"
        fpp_anchor_alpha_power:
          enabled: true
          contrast_type: "continuous"
          terms:
            - "z_fpp_anchor_alpha_power"
        duration_bin:
          enabled: false
          contrast_type: "categorical"
          terms:
            - "spp_duration_bin"
  test:
    method: "tfce"
    n_permutations: 60
    tail: 0
    adjacency: "mne_default"
    montage: "biosemi64"
    cluster_forming_alpha: 0.05
    seed: 0

    tfce_threshold:
       start: 0.0
       step: 0.01
